name: MySQL constraint tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  mysql-constraint-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nptor_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      EMAIL_HOST_PASSWORD: ci-email-password
      DB_NAME: nptor_local
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run MySQL-safe uniqueness tests
        run: >-
          python manage.py test
          quiz.tests_mysql_uniqueness
          subscriptions.tests_mysql_uniqueness
          -v 2
