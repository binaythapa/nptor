name: Full test suite

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nptor_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      EMAIL_HOST_PASSWORD: ci-email-password
      DB_NAME: nptor_local
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      CV_AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full Django test suite
        run: python manage.py test --noinput -v 2
