{% load static %}

<header class="admin-header">
  <div class="admin-header-inner">
    <div class="admin-header-left">
      <button id="admin-sidebar-toggle" class="button is-white is-small mr-3" type="button" aria-controls="admin-sidebar" aria-expanded="false" aria-label="Open navigation" title="Open navigation">
        <svg class="admin-sidebar-toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
      </button>

      <a class="admin-brand" href="{% url 'quiz:dashboard' %}">
        <img src="{% static 'images/logo.jpg' %}" class="admin-logo" alt="{{ site_name|default:'NPTOR' }}">
        <span class="admin-brand-text">NPTOR Admin</span>
      </a>
    </div>

    <div class="admin-header-right">
      <a href="{% url 'quiz:notifications_list' %}" class="admin-notification-link" aria-label="Notifications" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
        </svg>
        {% if unread_notifications_count %}
          <span class="admin-notification-badge">{{ unread_notifications_count }}</span>
        {% endif %}
      </a>

      <span class="admin-user is-hidden-mobile">
        <strong>{{ user.first_name|default:user.username }}</strong>
      </span>

      <a href="#logout" class="button is-light is-small" aria-label="Log out" title="Log out" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path>
        </svg>
      </a>

      <button id="theme-toggle" class="button is-white is-small" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg class="theme-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
