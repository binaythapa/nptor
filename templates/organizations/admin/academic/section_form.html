{% extends "organizations/admin/base.html" %}{% block content %}<div class="container py-4"><h1>Add Class Section</h1><form method="post" class="card card-body">{% csrf_token %}<label>Academic year</label><select class="form-control mb-3" name="academic_year" required>{% for year in years %}<option value="{{ year.id }}">{{ year.name }}</option>{% endfor %}</select><label>Class</label><select class="form-control mb-3" name="class_group" required>{% for klass in classes %}<option value="{{ klass.id }}">{{ klass.name }}</option>{% endfor %}</select><label>Section</label><input class="form-control mb-3" name="name" required><label>Capacity</label><input class="form-control mb-3" type="number" name="capacity"><button class="btn btn-primary">Save</button></form></div>{% endblock %}
