{% extends "organizations/admin/base.html" %}{% block content %}<div class="container py-4"><h1>Assign Learning Resource</h1><p class="text-muted">{{ section }}</p><form method="post" class="card card-body">{% csrf_token %}<label>Resource type</label><select name="resource_type" class="form-control mb-3"><option value="course">Course</option><option value="track">Track</option><option value="exam">Exam</option></select><label>Resource</label><select name="resource_id" class="form-control mb-3"><optgroup label="Courses">{% for item in courses %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</optgroup><optgroup label="Tracks">{% for item in tracks %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</optgroup><optgroup label="Exams">{% for item in exams %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</optgroup></select><button class="btn btn-primary">Assign to Class</button></form></div>{% endblock %}
