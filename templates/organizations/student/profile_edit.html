{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>{% if admin_view %}Edit Student Profile{% else %}Edit My Organization Profile{% endif %}</h1>
  <p class="text-muted">{{ organization.name }}</p>
  <form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-3"><button class="btn btn-primary" type="submit">Save Profile</button>
    {% if admin_view %}<a class="btn btn-secondary" href="{% url 'organizations_public:student_profile_admin' slug=organization.slug student_id=student.id %}">Cancel</a>{% else %}<a class="btn btn-secondary" href="{% url 'organizations_public:student_profile' slug=organization.slug %}">Cancel</a>{% endif %}</div>
  </form>
</div>
{% endblock %}
