{% if lessons %}

    <ul class="lesson-list">

        {% for lesson in lessons %}

            <li class="lesson-item">

                <div class="lesson-info">

                    <div class="lesson-title">

                        {{ forloop.counter }}.
                        {{ lesson.title }}

                    </div>

                    <div class="lesson-type">

                        {{ lesson.get_lesson_type_display }}

                    </div>

                </div>


                <div class="lesson-actions">

                    <a
                        href="{% url 'courses:lesson_edit' lesson.id %}"
                    >
                        Edit Lesson
                    </a>


                    <form
                        method="post"
                        hx-post="{% url 'courses:api_delete_lesson' lesson.id %}"
                        hx-target="#lesson-area-{{ section.id }}"
                        hx-swap="innerHTML"
                        onsubmit="
                            return confirm(
                                'Delete this lesson?'
                            );
                        "
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="lesson-delete-btn"
                        >
                            Delete
                        </button>

                    </form>

                </div>

            </li>

        {% endfor %}

    </ul>

{% else %}

    <div class="empty-lessons">

        No lessons have been added
        to this section yet.

    </div>

{% endif %}


<!-- =========================================================
     ADD LESSON
========================================================= -->

<div class="add-lesson-panel">

    <form
        method="post"
        hx-post="{% url 'courses:api_create_lesson' %}"
        hx-target="#lesson-area-{{ section.id }}"
        hx-swap="innerHTML"
    >

        {% csrf_token %}

        <input
            type="hidden"
            name="section_id"
            value="{{ section.id }}"
        >


        <div class="add-lesson-form">

            <input
                type="text"
                name="title"
                class="builder-input"
                placeholder="Lesson title"
                required
            >


            <button
                type="submit"
                class="builder-btn btn-submit"
            >
                + Add Lesson
            </button>


            <span class="htmx-indicator">
                Adding...
            </span>

        </div>

    </form>

</div>
