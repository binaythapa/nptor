{% extends "layouts/student/base.html" %}

{% block content %}

<section
    style="
        max-width: 480px;
        margin: 60px auto;
        padding: 0 15px;
    "
>

    <div
        class="card-surface"
        style="
            padding: 35px 30px;
            text-align: center;
        "
    >

        <!-- =====================================================
             SUCCESS ICON
        ====================================================== -->

        <div class="mb-4">

            <span
                class="icon has-text-success"
                style="font-size:64px;"
            >
                <i
                    class="fa fa-circle-check"
                    aria-hidden="true"
                ></i>
            </span>

        </div>


        <!-- =====================================================
             TITLE
        ====================================================== -->

        <h1 class="title is-4 mb-3">

            Password Reset Successful

        </h1>


        <!-- =====================================================
             MESSAGE
        ====================================================== -->

        <p class="mb-2">

            Your password has been updated successfully.

        </p>

        <p class="small-muted mb-5">

            You can now sign in using your new password.

        </p>


        <!-- =====================================================
             LOGIN BUTTON
        ====================================================== -->

        <a
            href="{% url 'accounts:request-login-otp' %}"
            class="button is-primary is-fullwidth"
        >
            Go to Login
        </a>


        <!-- =====================================================
             HOME
        ====================================================== -->

        <div
            class="small-muted"
            style="margin-top:20px;"
        >

            <a href="/">
                Return to Home
            </a>

        </div>

    </div>

</section>

{% endblock %}
