{% extends "layouts/student/base.html" %}

{% block content %}

<section
    style="
        max-width: 600px;
        margin: 40px auto;
        padding: 0 15px;
    "
>

    <div
        class="card-surface"
        style="
            padding: 35px 30px;
        "
    >

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="has-text-centered mb-5">

            <h1 class="title is-3 mb-2">
                Create your account
            </h1>

            <p class="has-text-grey">
                Start your learning journey with us.
            </p>

        </div>


        <!-- =====================================================
             ERROR
        ====================================================== -->

        {% if error %}

        <div class="notification is-danger">
            {{ error }}
        </div>

        {% endif %}


        <!-- =====================================================
             REGISTRATION FORM
        ====================================================== -->

        <form
            method="post"
            action="{% url 'accounts:register' %}"
            id="registration-form"
        >

            {% csrf_token %}


            <!-- =================================================
                 FIRST NAME
            ================================================== -->

            <div class="field">

                <label
                    class="label"
                    for="id_first_name"
                >
                    First Name
                </label>

                <div class="control">

                    <input
                        type="text"
                        id="id_first_name"
                        name="first_name"
                        class="input"
                        placeholder="Enter your first name"
                        value="{{ first_name|default:'' }}"
                        autocomplete="given-name"
                        required
                    >

                </div>

            </div>


            <!-- =================================================
                 LAST NAME
            ================================================== -->

            <div class="field">

                <label
                    class="label"
                    for="id_last_name"
                >
                    Last Name
                </label>

                <div class="control">

                    <input
                        type="text"
                        id="id_last_name"
                        name="last_name"
                        class="input"
                        placeholder="Enter your last name"
                        value="{{ last_name|default:'' }}"
                        autocomplete="family-name"
                        required
                    >

                </div>

            </div>


            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div class="field">

                <label
                    class="label"
                    for="id_email"
                >
                    Email Address
                </label>

                <div class="control">

                    <input
                        type="email"
                        id="id_email"
                        name="email"
                        class="input"
                        placeholder="you@example.com"
                        value="{{ email|default:'' }}"
                        autocomplete="email"
                        required
                    >

                </div>

                <p
                    id="email-status"
                    class="help"
                    style="display:none;"
                ></p>

            </div>


            <!-- =================================================
                 COUNTRY
            ================================================== -->

            <div class="field">

                <label
                    class="label"
                    for="id_country"
                >
                    Country
                    <span class="has-text-grey">
                        (Optional)
                    </span>
                </label>

                <div class="control">

                    <div class="select is-fullwidth">

                        <select
                            id="id_country"
                            name="country"
                        >

                            <option value="">
                                Select country
                            </option>

                            {% for code, name in countries %}

                            <option
                                value="{{ code }}"
                                {% if code == country %}
                                    selected
                                {% endif %}
                            >
                                {{ name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 PHONE
            ================================================== -->

            <div class="field">

                <label
                    class="label"
                    for="id_phone"
                >
                    Phone Number
                    <span class="has-text-grey">
                        (Optional)
                    </span>
                </label>

                <div class="control">

                    <input
                        type="tel"
                        id="id_phone"
                        name="phone"
                        class="input"
                        placeholder="Phone number"
                        value="{{ phone|default:'' }}"
                        autocomplete="tel"
                    >

                </div>

                <p class="help">
                    You can add or verify your phone number later.
                </p>

            </div>


            <!-- =================================================
                 TERMS & PRIVACY
            ================================================== -->

            <div class="field mt-5">

                <label class="checkbox">

                    <input
                        type="checkbox"
                        name="accepted_policy"
                        value="1"
                        required
                    >

                    I accept the

                    <a
                        href="/privacy/"
                        target="_blank"
                        rel="noopener"
                    >
                        Terms & Privacy Policy
                    </a>

                </label>

            </div>


            <!-- =================================================
                 SEND OTP
            ================================================== -->

            <div class="field mt-5">

                <button
                    type="submit"
                    id="register-btn"
                    class="button is-primary is-fullwidth"
                >
                    Send Verification OTP
                </button>

            </div>

        </form>


        <!-- =====================================================
             LOGIN
        ====================================================== -->

        <div
            class="has-text-centered small-muted"
            style="margin-top: 25px;"
        >

            Already have an account?

            <a
                href="{% url 'accounts:request-login-otp' %}"
            >
                Sign in
            </a>

        </div>

    </div>

</section>


<!-- ============================================================
     EMAIL AVAILABILITY CHECK
============================================================= -->

<script>

(function () {

    const emailInput =
        document.getElementById("id_email");

    const status =
        document.getElementById("email-status");

    if (!emailInput || !status) {
        return;
    }

    let timeout = null;

    emailInput.addEventListener(
        "input",
        function () {

            clearTimeout(timeout);

            const email =
                emailInput.value.trim();

            status.style.display = "none";

            if (!email) {
                return;
            }

            timeout = setTimeout(
                function () {

                    fetch(
                        "{% url 'accounts:check_email' %}?email=" +
                        encodeURIComponent(email),
                        {
                            method: "GET",
                            headers: {
                                "X-Requested-With":
                                    "XMLHttpRequest"
                            }
                        }
                    )
                    .then(
                        response => response.json()
                    )
                    .then(
                        data => {

                            status.style.display =
                                "block";

                            if (data.available) {

                                status.className =
                                    "help has-text-success";

                                status.textContent =
                                    "Email is available.";

                            } else {

                                status.className =
                                    "help has-text-danger";

                                status.textContent =
                                    "An account with this email already exists.";

                            }

                        }
                    )
                    .catch(
                        function () {

                            status.style.display =
                                "none";

                        }
                    );

                },
                500
            );

        }
    );

})();

</script>

{% endblock %}
