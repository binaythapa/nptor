<section class="practice-completed-card">

    <div class="practice-completed-icon"
         aria-hidden="true">

        ✓

    </div>


    <h2>
        Practice Complete!
    </h2>


    <p>
        You've completed all available questions
        in this practice session.
    </p>


    <div class="practice-card-actions">

        <a
            href="{% url 'quiz:exam_list' %}"
            class="practice-btn practice-btn-primary">

            Explore Courses &amp; Exams

        </a>


        <a
            href="{% url 'quiz:practice' %}?reset=1{% if request.GET.course %}&amp;course={{ request.GET.course|urlencode }}{% endif %}{% if request.GET.lesson %}&amp;lesson={{ request.GET.lesson|urlencode }}{% endif %}"
            class="practice-btn practice-btn-secondary"
            {% if request.GET.course and request.GET.lesson %}
            data-practice-restart="1"
            data-course="{{ request.GET.course|escape }}"
            data-lesson="{{ request.GET.lesson|escape }}"
            {% endif %}>

            Practice Again

        </a>

    </div>

</section>
