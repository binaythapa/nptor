{% extends "layouts/student/base.html" %}

{% block content %}
<section class="section">
  <div class="container">
    <h1 class="title">{{ heading }}</h1>
    <div class="box">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="buttons mt-4">
          <button class="button is-primary" type="submit">Save CV</button>
          <a class="button" href="{% url 'cv:dashboard' %}">Cancel</a>
          {% if cv %}<a class="button" href="{% url 'cv:cv_preview' cv.pk %}">Preview</a>{% endif %}
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
